name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build-test:
    name: Build and test
    runs-on: windows-latest
    env:
      RestoreLockedMode: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Commit message attribution check
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          $messages = git log --format=%B "${{ github.event.pull_request.base.sha }}..HEAD"
          if ($messages -match '(?im)^\s*(co-authored-by|generated[ -]with|generated-by)\s*[: ]') {
            Write-Host 'Forbidden attribution trailer (Co-Authored-By / Generated with) found in commit messages.'
            exit 1
          }

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        shell: pwsh
        run: |
          dotnet restore .\DeskBox.sln --locked-mode -p:Platform=x64 -p:RuntimeIdentifier=win-x64

      - name: Build
        run: dotnet build .\src\DeskBox\DeskBox.csproj --configuration Release --no-restore -p:Platform=x64 -p:RuntimeIdentifier=win-x64 -v:minimal

      - name: Test
        timeout-minutes: 10
        run: dotnet test .\tests\DeskBox.Tests\DeskBox.Tests.csproj --configuration Release --no-restore -p:Platform=x64 -p:RuntimeIdentifier=win-x64 -p:WindowsAppSdkBootstrapInitialize=false --blame-hang --blame-hang-timeout 5m --logger "trx;LogFileName=test-results.trx" -v:minimal

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/DeskBox.Tests/TestResults/**/*.trx

      # Publishes the built app so a change can be smoke-tested without a local
      # toolchain. The output is unpackaged (WindowsPackageType=None), so
      # launching it still requires the Windows App Runtime on the test machine.
      # Warns rather than fails when the path is empty, so a layout change cannot
      # turn a green build red.
      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DeskBox-win-x64
          path: src/DeskBox/bin/x64/Release/net10.0-windows10.0.22621.0/win-x64/
          if-no-files-found: warn
          retention-days: 14
